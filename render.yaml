services:
  - type: web
    name: pratyaksh-hotel
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pratyaksh-bookings
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: pserv
    name: pratyaksh-bookings
    runtime: postgres
    plan: basic-256mb
    databaseName: pratyaksh
    user: pratyaksh
