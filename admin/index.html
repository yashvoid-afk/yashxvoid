<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Guest requests | Pratyaksh</title>
  <style>
    :root{color-scheme:light;--ink:#25231f;--muted:#777064;--paper:#f7f2e9;--line:#e6dece;--blue:#172c64;--red:#a94428;--gold:#e8bc69}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}.top{background:var(--blue);color:#fff;padding:22px max(5vw,24px);display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:2px}.brand small{display:block;font:9px/1.6 system-ui,sans-serif;letter-spacing:2px;color:#e8bc69}.top a{color:#f5dcad;font-size:12px}.wrap{max-width:1250px;margin:38px auto;padding:0 22px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:700}.heading h1{font:42px/1.1 Georgia,serif;font-weight:400;margin:8px 0}.heading p{color:var(--muted);margin:0}.refresh{border:0;background:var(--gold);padding:12px 18px;font-weight:700;cursor:pointer}.summary{display:flex;gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);padding:17px 20px;min-width:170px}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.stat strong{font:28px Georgia,serif}.table-wrap{overflow:auto;background:white;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #eee8dd;vertical-align:top}th{font-size:9px;letter-spacing:1.1px;color:#776c5c;background:#faf8f3}td{font-size:12px}td small{display:block;color:var(--muted);font-size:10px}.amount{font-weight:700;white-space:nowrap}.status{padding:6px 12px;color:var(--muted);font-size:12px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:600px){.top{padding:17px 20px}.wrap{margin:25px auto;padding:0 14px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:35px}.summary{flex-wrap:wrap}.stat{flex:1;min-width:130px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">PRATYAKSH<small>HOTEL &amp; SPA · JAIPUR</small></div><a href="/">View hotel website ↗</a></header>
  <main class="wrap">
    <div class="heading"><div><span class="eyebrow">PRIVATE ADMINISTRATION</span><h1>Guest requests</h1><p>Recent booking enquiries, newest first.</p></div><button class="refresh" id="refresh">↻ &nbsp; Refresh</button></div>
    <section class="summary" aria-label="Booking summary"><div class="stat"><small>ALL REQUESTS</small><strong id="total">—</strong></div><div class="stat"><small>SHOWING RECENT</small><strong id="shown">—</strong></div></section>
    <div class="table-wrap"><table><thead><tr><th>GUEST</th><th>STAY</th><th>ROOM</th><th>GUESTS</th><th>ESTIMATED TOTAL</th><th>REQUESTED</th></tr></thead><tbody id="rows"><tr><td class="status" colspan="6">Loading booking requests…</td></tr></tbody></table></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
<script>
  const rows = document.querySelector('#rows');
  const safe = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const date = (value) => value ? new Date(`${value.slice(0,10)}T00:00:00`).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
  const money = (value) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(value));
  async function loadBookings(){
    const status=document.querySelector('#status');
    status.textContent='Refreshing…';
    try {
      const response=await fetch('/api/admin/bookings',{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok) throw new Error(response.status===401?'Your admin session expired. Reload and sign in again.':'Could not load booking requests.');
      const data=await response.json();
      document.querySelector('#total').textContent=data.total;
      document.querySelector('#shown').textContent=data.bookings.length;
      rows.innerHTML=data.bookings.length ? data.bookings.map((b)=>`<tr><td><strong>${safe(b.guest_name)}</strong><small>${safe(b.email)} · ${safe(b.phone)}</small></td><td>${date(b.check_in)}<small>to ${date(b.check_out)} · ${b.nights} night${b.nights===1?'':'s'}</small></td><td>${safe(b.room_name)}</td><td>${b.guests}</td><td class="amount">${money(b.total_inr)}</td><td>${new Date(b.created_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</td></tr>`).join('') : '<tr><td class="empty" colspan="6">No booking requests yet. New requests will appear here.</td></tr>';
      status.textContent=`Showing the latest ${data.bookings.length} of ${data.total} requests.`;
    } catch(error){rows.innerHTML=`<tr><td class="empty" colspan="6">${safe(error.message)}</td></tr>`;status.textContent='';}
  }
  document.querySelector('#refresh').addEventListener('click',loadBookings);
  loadBookings();
</script>
</body>
</html>
